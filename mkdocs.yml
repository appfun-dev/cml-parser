site_name: CML Parser
site_description: Context Mapper Language parser for Python with ANTLR4
site_url: https://martin882003.github.io/cml-parser
repo_url: https://github.com/martin882003/cml-parser
repo_name: martin882003/cml-parser
theme:
  name: material
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  palette:
    - scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
  - def_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
plugins:
  - search
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Learn CML: Aprende CML
            Introduction: Introducción
            Strategic DDD: DDD Estratégico
            Requirements: Requerimientos
            Tactical DDD: DDD Táctico
            Application Layer: Capa de aplicación
extra:
  analytics:
    provider: google
    property: G-XCMEXKWTSM
nav:
  - index.md
  - quickstart.md
  - usage.md
  - cli.md
  - examples.md
  - reference.md
  - Learn CML:
    - Introduction: tutorial/index.md
    - Requirements: tutorial/requirements.md
    - Strategic DDD: tutorial/strategic.md
    - Tactical DDD: tutorial/tactical.md
    - Application Layer: tutorial/application.md
